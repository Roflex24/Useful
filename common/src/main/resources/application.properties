spring.application.name=common
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/common}
spring.datasource.username=${DB_USER:common}
spring.datasource.password=${DB_PASSWORD:common}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
management.endpoints.web.exposure.include=health,prometheus
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
services.finance.url=${FINANCE_URL:http://localhost:8081}
services.food.url=${FOOD_URL:http://localhost:8082}
services.kanban.url=${KANBAN_URL:http://localhost:8083}
