<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Депозиты — все данные</title>
    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg:        #060C1A;
            --surface:   rgba(255,255,255,0.042);
            --s-hover:   rgba(255,255,255,0.068);
            --border:    rgba(255,255,255,0.08);
            --border-lit:rgba(99,102,241,0.3);
            --indigo:    #6366F1;
            --emerald:   #10B981;
            --amber:     #F59E0B;
            --rose:      #F43F5E;
            --violet:    #8B5CF6;
            --sky:       #38BDF8;
            --text:      #F0F4FF;
            --text-2:    #B8C8E0;
            --text-3:    #6B7E99;
            --fd:        'Syne', sans-serif;
            --fu:        'Inter', sans-serif;
            --fn:        'JetBrains Mono', monospace;
            --r:         16px;
            --rl:        22px;
            --rxl:       30px;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { font-family:var(--fu); background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden; }

        .aurora { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
        .ab { position:absolute; border-radius:50%; filter:blur(110px); animation:drift 22s ease-in-out infinite alternate; }
        .ab:nth-child(1) { width:600px;height:420px; background:radial-gradient(circle,#6366F1,transparent 70%); top:-100px;left:-60px; opacity:0.2; }
        .ab:nth-child(2) { width:460px;height:460px; background:radial-gradient(circle,#8B5CF6,transparent 70%); top:45%;right:-80px; opacity:0.13; animation-duration:28s; animation-delay:-9s; }
        .ab:nth-child(3) { width:360px;height:360px; background:radial-gradient(circle,#14B8A6,transparent 70%); bottom:-50px;left:42%; opacity:0.11; animation-duration:26s; animation-delay:-4s; }
        @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(45px,30px) scale(1.08)} }

        .layout { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:28px 22px 60px; }

        .glass { background:var(--surface); border:1px solid var(--border); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }

        .nav { display:flex; justify-content:space-between; align-items:center; padding:13px 20px; border-radius:var(--rl); margin-bottom:28px; gap:14px; flex-wrap:wrap; }
        .nav-brand { display:flex; align-items:center; gap:13px; }
        .nav-icon { width:40px;height:40px; border-radius:11px; background:linear-gradient(145deg,var(--violet),#7C3AED); display:flex;align-items:center;justify-content:center; color:#fff; font-size:0.95rem; box-shadow:0 0 0 1px rgba(139,92,246,0.38),0 6px 20px rgba(139,92,246,0.28); }
        .nav-title { font-family:var(--fd); font-size:1.25rem; font-weight:700; }
        .nav-sub { font-size:0.7rem; color:var(--text-3); margin-top:2px; }
        .btn-ghost { background:var(--surface); border:1px solid var(--border); color:var(--text-2); padding:8px 16px; border-radius:10px; font-family:var(--fu); font-size:0.8rem; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:7px; text-decoration:none; transition:all 0.18s; }
        .btn-ghost:hover { background:var(--s-hover); border-color:var(--border-lit); color:var(--text); }

        .content-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: var(--rl);
            padding: 20px;
        }
        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--fd);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .panel-header i { color: var(--violet); }

        .bonds-table-container {
            max-height: 70vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--r);
            background: rgba(0,0,0,0.2);
        }
        .bonds-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .bonds-table th {
            position: sticky;
            top: 0;
            background: rgba(10,18,36,0.95);
            color: var(--text-2);
            font-weight: 600;
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(4px);
            z-index: 1;
        }
        .bonds-table td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: var(--text-2);
        }
        .bonds-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .bonds-table .yield-col { font-family: var(--fn); font-weight: 600; color: var(--emerald); }

        .loading-widget { color: var(--text-3); font-size: 0.85rem; padding: 8px 0; }
        .error-widget { color: var(--rose); font-size: 0.85rem; padding: 8px 0; }
        .error-widget button { background: var(--violet); color: white; border: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; margin-left: 8px; }

        @media(max-width:600px) {
            .bonds-table th, .bonds-table td { padding: 6px 8px; }
        }
    </style>
</head>
<body>

<div class="aurora"><div class="ab"></div><div class="ab"></div><div class="ab"></div></div>

<div class="layout">
    <nav class="nav glass">
        <div class="nav-brand">
            <div class="nav-icon"><i class="fas fa-piggy-bank"></i></div>
            <div>
                <div class="nav-title">Депозиты</div>
                <div class="nav-sub">Полный список депозитов банков</div>
            </div>
        </div>
        <a href="/page/invest" class="btn-ghost"><i class="fas fa-arrow-left"></i> Назад</a>
    </nav>

    <div class="content-panel">
        <div class="panel-header">
            <i class="fas fa-table"></i> Все депозиты (отсортированы по ставке)
        </div>
        <div id="depositsContent">
            <div class="loading-widget"><i class="fas fa-spinner fa-pulse"></i> Загрузка данных по депозитам...</div>
        </div>
    </div>
</div>

<script>
    async function loadAllDeposits() {
        const container = document.getElementById('depositsContent');
        container.innerHTML = '<div class="loading-widget"><i class="fas fa-spinner fa-pulse"></i> Загрузка данных по депозитам...</div>';
        try {
            // Запрашиваем большое количество записей (например, 1000) с сортировкой по ставке
            const resp = await fetch('/api/deposits/rates?page=0&size=1000&sort=rateMin,desc');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (data && data.rates && Array.isArray(data.rates)) {
                const totalBanks = data.totalBanks || 0;
                if (data.rates.length === 0) {
                    container.innerHTML = `<div class="loading-widget">Нет данных по депозитам</div>`;
                    return;
                }
                let tableHtml = `
                    <div style="margin-bottom:8px;font-size:0.8rem;color:var(--text-2);">
                        <i class="fas fa-university"></i> Найдено банков: ${totalBanks}
                    </div>
                    <div class="bonds-table-container">
                        <table class="bonds-table">
                            <thead>
                                <tr>
                                    <th>Банк</th>
                                    <th>Ставка, %</th>
                                    <th>Начисление процентов</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                data.rates.forEach(item => {
                    let calcIcon = '';
                    let calcText = item.percentCalculation || '—';

                    if (calcText.includes('ежедневный')) {
                        calcIcon = '<i class="fas fa-sun" style="color:var(--amber);"></i>';
                    } else if (calcText.includes('минимальный')) {
                        calcIcon = '<i class="fas fa-moon" style="color:var(--sky);"></i>';
                    } else {
                        calcIcon = '<i class="fas fa-question-circle" style="color:var(--text-3);"></i>';
                    }

                    tableHtml += `
                        <tr>
                            <td>${item.bankName || '—'}</td>
                            <td class="yield-col">${item.rateMin != null ? item.rateMin.toFixed(2) : '—'}</td>
                            <td>
                                <span style="display:inline-flex;align-items:center;gap:6px;">
                                    ${calcIcon}
                                    <span>${calcText}</span>
                                </span>
                            </td>
                        </tr>
                    `;
                });
                tableHtml += '</tbody></table></div>';
                container.innerHTML = tableHtml;
            } else {
                throw new Error('Неверный формат ответа');
            }
        } catch(e) {
            container.innerHTML = `
                <div class="error-widget">
                    <i class="fas fa-exclamation-triangle"></i> Ошибка загрузки данных по депозитам
                    <button onclick="loadAllDeposits()">Повторить</button>
                </div>
            `;
        }
    }

    loadAllDeposits();
</script>
</body>
</html>
