<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ключевая ставка, курсы валют и облигации ОФЗ</title>
    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js (может понадобиться для будущих графиков, оставлен) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg:        #060C1A;
            --surface:   rgba(255,255,255,0.042);
            --s-hover:   rgba(255,255,255,0.068);
            --border:    rgba(255,255,255,0.08);
            --border-lit:rgba(99,102,241,0.3);
            --indigo:    #6366F1;
            --emerald:   #10B981;
            --amber:     #F59E0B;
            --rose:      #F43F5E;
            --violet:    #8B5CF6;
            --sky:       #38BDF8;
            --text:      #F0F4FF;
            --text-2:    #B8C8E0;
            --text-3:    #6B7E99;
            --fd:        'Syne', sans-serif;
            --fu:        'Inter', sans-serif;
            --fn:        'JetBrains Mono', monospace;
            --r:         16px;
            --rl:        22px;
            --rxl:       30px;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { font-family:var(--fu); background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden; }

        /* Aurora background */
        .aurora { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
        .ab { position:absolute; border-radius:50%; filter:blur(110px); animation:drift 22s ease-in-out infinite alternate; }
        .ab:nth-child(1) { width:600px;height:420px; background:radial-gradient(circle,#6366F1,transparent 70%); top:-100px;left:-60px; opacity:0.2; }
        .ab:nth-child(2) { width:460px;height:460px; background:radial-gradient(circle,#8B5CF6,transparent 70%); top:45%;right:-80px; opacity:0.13; animation-duration:28s; animation-delay:-9s; }
        .ab:nth-child(3) { width:360px;height:360px; background:radial-gradient(circle,#14B8A6,transparent 70%); bottom:-50px;left:42%; opacity:0.11; animation-duration:26s; animation-delay:-4s; }
        @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(45px,30px) scale(1.08)} }

        .layout { position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:28px 22px 60px; }

        /* Glassmorphism */
        .glass { background:var(--surface); border:1px solid var(--border); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }

        /* Nav */
        .nav { display:flex; justify-content:space-between; align-items:center; padding:13px 20px; border-radius:var(--rl); margin-bottom:28px; gap:14px; flex-wrap:wrap; }
        .nav-brand { display:flex; align-items:center; gap:13px; }
        .nav-icon { width:40px;height:40px; border-radius:11px; background:linear-gradient(145deg,var(--violet),#7C3AED); display:flex;align-items:center;justify-content:center; color:#fff; font-size:0.95rem; box-shadow:0 0 0 1px rgba(139,92,246,0.38),0 6px 20px rgba(139,92,246,0.28); }
        .nav-title { font-family:var(--fd); font-size:1.25rem; font-weight:700; }
        .nav-sub { font-size:0.7rem; color:var(--text-3); margin-top:2px; }
        .btn-ghost { background:var(--surface); border:1px solid var(--border); color:var(--text-2); padding:8px 16px; border-radius:10px; font-family:var(--fu); font-size:0.8rem; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:7px; text-decoration:none; transition:all 0.18s; }
        .btn-ghost:hover { background:var(--s-hover); border-color:var(--border-lit); color:var(--text); }

        /* Toast */
        .toasts { position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:8px; }
        .toast { display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:var(--r);border:1px solid var(--border);background:rgba(11,19,38,0.95);backdrop-filter:blur(18px);font-size:0.8rem;font-weight:500;animation:tin 0.25s ease; }
        @keyframes tin { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
        .toast.e { border-color:rgba(244,63,94,0.3);color:var(--rose); }

        /* =============== СТИЛИ ДЛЯ ВИДЖЕТОВ =============== */
        .widget-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: var(--rl);
            padding: 18px 20px;
            margin-bottom: 18px;
        }
        .widget-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--fd);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 14px;
        }
        .widget-header i {
            color: var(--violet);
            font-size: 0.85rem;
        }
        .widget-refresh {
            background: none;
            border: none;
            color: var(--text-3);
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: auto;
            transition: color 0.2s, transform 0.2s;
        }
        .widget-refresh:hover {
            color: var(--text);
            transform: rotate(45deg);
        }
        .widget-value {
            font-family: var(--fn);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 30%, var(--violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            margin-bottom: 4px;
        }
        .widget-date {
            font-size: 0.72rem;
            color: var(--text-3);
            margin-top: 4px;
        }
        .widget-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 7px 14px;
            border-radius: 9px;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.18s;
            margin-top: 12px;
            width: 100%;
            justify-content: center;
        }
        .widget-link:hover {
            background: var(--s-hover);
            border-color: var(--border-lit);
            color: var(--text);
        }
        .currency-rates-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 10px 0 12px;
        }
        .currency-item-widget {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 12px;
            text-align: center;
        }
        .currency-symbol {
            font-size: 1.2rem;
            margin-bottom: 6px;
        }
        .currency-rate-widget {
            font-family: var(--fn);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--emerald);
        }
        .currency-name-widget {
            font-size: 0.7rem;
            color: var(--text-3);
            margin-top: 4px;
        }
        .loading-widget {
            color: var(--text-3);
            font-size: 0.85rem;
            padding: 8px 0;
        }
        .error-widget {
            color: var(--rose);
            font-size: 0.85rem;
            padding: 8px 0;
        }
        .error-widget button {
            background: var(--violet);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        /* Стили для таблицы облигаций */
        .bonds-table-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--r);
            margin: 10px 0 12px;
            background: rgba(0,0,0,0.2);
        }
        .bonds-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .bonds-table th {
            position: sticky;
            top: 0;
            background: rgba(10,18,36,0.95);
            color: var(--text-2);
            font-weight: 600;
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(4px);
        }
        .bonds-table td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: var(--text-2);
        }
        .bonds-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .bonds-table .price-col {
            font-family: var(--fn);
            font-weight: 600;
            color: var(--text);
        }
        .bonds-table .yield-col {
            font-family: var(--fn);
            font-weight: 600;
            color: var(--emerald);
        }
        .bonds-table .coupon-col,
        .bonds-table .maturity-col,
        .bonds-table .type-col {
            font-size: 0.75rem;
        }

        /* Адаптивность */
        @media(max-width:600px) {
            .currency-rates-grid { grid-template-columns: 1fr; }
            .widget-value { font-size: 1.8rem; }
            .bonds-table-container { max-height: 300px; }
            .bonds-table th, .bonds-table td { padding: 6px 8px; }
        }
    </style>
</head>
<body>

<div class="aurora"><div class="ab"></div><div class="ab"></div><div class="ab"></div></div>
<div class="toasts" id="toasts"></div>

<div class="layout">

    <!-- Навигация (заголовок страницы) -->
    <nav class="nav glass">
        <div class="nav-brand">
            <div class="nav-icon"><i class="fas fa-chart-line"></i></div>
            <div>
                <div class="nav-title">Финансовые индикаторы</div>
                <div class="nav-sub">Ключевая ставка, валюты и облигации ОФЗ</div>
            </div>
        </div>
        <a href="/page/finance" class="btn-ghost"><i class="fas fa-arrow-left"></i> Назад к финансам</a>
    </nav>

    <!-- ВИДЖЕТ: КЛЮЧЕВАЯ СТАВКА ЦБ РФ -->
    <div class="widget-panel">
        <div class="widget-header">
            <i class="fas fa-percent"></i> Ключевая ставка ЦБ РФ
            <button class="widget-refresh" id="refreshKeyrateBtn" title="Обновить"><i class="fas fa-sync-alt"></i></button>
        </div>
        <div id="keyrateContent">
            <div class="loading-widget"><i class="fas fa-spinner fa-pulse"></i> Загрузка...</div>
        </div>
        <a href="/page/key/rate" class="widget-link" id="keyrateDetailLink">
            <i class="fas fa-chart-line"></i> Подробнее о ставке →
        </a>
    </div>

    <!-- ВИДЖЕТ: КУРСЫ ВАЛЮТ ЦБ РФ -->
    <div class="widget-panel">
        <div class="widget-header">
            <i class="fas fa-chart-line"></i> Курсы валют ЦБ РФ
            <button class="widget-refresh" id="refreshCurrencyBtn" title="Обновить"><i class="fas fa-sync-alt"></i></button>
        </div>
        <div id="currencyContent">
            <div class="loading-widget"><i class="fas fa-spinner fa-pulse"></i> Загрузка курсов...</div>
        </div>
        <a href="/page/currency/rate" class="widget-link" id="currencyDetailLink">
            <i class="fas fa-chart-line"></i> Подробнее о курсах валют →
        </a>
    </div>

    <!-- НОВЫЙ ВИДЖЕТ: ОБЛИГАЦИИ ОФЗ -->
    <div class="widget-panel">
        <div class="widget-header">
            <i class="fas fa-file-invoice-dollar"></i> Облигации ОФЗ
            <button class="widget-refresh" id="refreshBondsBtn" title="Обновить"><i class="fas fa-sync-alt"></i></button>
        </div>
        <div id="bondsContent">
            <div class="loading-widget"><i class="fas fa-spinner fa-pulse"></i> Загрузка данных по облигациям...</div>
        </div>
    </div>

</div>

<script>
    // =============== ФУНКЦИИ ДЛЯ КЛЮЧЕВОЙ СТАВКИ И ВАЛЮТ ===============

    async function loadKeyRate() {
        const container = document.getElementById('keyrateContent');
        container.innerHTML = '<div class="loading-widget"><i class="fas fa-spinner fa-pulse"></i> Загрузка ставки...</div>';
        try {
            // Предполагаемый API endpoint для получения ключевой ставки
            const resp = await fetch('/api/key/rate');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (data.keyRate !== undefined && data.date) {
                container.innerHTML = `
                    <div class="widget-value">${data.keyRate.toFixed(2)}%</div>
                    <div class="widget-date"><i class="far fa-calendar-check"></i> Актуальна на ${data.date}</div>
                `;
            } else {
                throw new Error('Неверный формат ответа');
            }
        } catch(e) {
            container.innerHTML = `
                <div class="error-widget">
                    <i class="fas fa-exclamation-triangle"></i> Ошибка загрузки
                    <button onclick="loadKeyRate()">Повторить</button>
                </div>
            `;
        }
    }

    async function loadCurrencyRates() {
        const container = document.getElementById('currencyContent');
        container.innerHTML = '<div class="loading-widget"><i class="fas fa-spinner fa-pulse"></i> Загрузка курсов...</div>';
        try {
            const resp = await fetch('/api/currency/rate');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (data.usdRate !== undefined && data.eurRate !== undefined) {
                container.innerHTML = `
                    <div class="currency-rates-grid">
                        <div class="currency-item-widget">
                            <div class="currency-symbol">💰 USD</div>
                            <div class="currency-rate-widget">${data.usdRate.toFixed(2)} ₽</div>
                            <div class="currency-name-widget">Доллар США</div>
                        </div>
                        <div class="currency-item-widget">
                            <div class="currency-symbol">💶 EUR</div>
                            <div class="currency-rate-widget">${data.eurRate.toFixed(2)} ₽</div>
                            <div class="currency-name-widget">Евро</div>
                        </div>
                    </div>
                `;
            } else {
                throw new Error('Неверный формат ответа');
            }
        } catch(e) {
            container.innerHTML = `
                <div class="error-widget">
                    <i class="fas fa-exclamation-triangle"></i> Ошибка загрузки
                    <button onclick="loadCurrencyRates()">Повторить</button>
                </div>
            `;
        }
    }

    // =============== НОВАЯ ФУНКЦИЯ ДЛЯ ОБЛИГАЦИЙ ===============

    async function loadBonds() {
        const container = document.getElementById('bondsContent');
        container.innerHTML = '<div class="loading-widget"><i class="fas fa-spinner fa-pulse"></i> Загрузка данных по облигациям...</div>';
        try {
            const resp = await fetch('/api/ofz');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const bonds = await resp.json();
            if (Array.isArray(bonds)) {
                if (bonds.length === 0) {
                    container.innerHTML = '<div class="loading-widget">Нет данных по облигациям</div>';
                    return;
                }
                // Строим таблицу
                let tableHtml = `
                    <div class="bonds-table-container">
                        <table class="bonds-table">
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Цена, ₽</th>
                                    <th>Доходность, %</th>
                                    <th>Купон, ₽</th>
                                    <th>Погашение</th>
                                    <th>Тип</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                bonds.forEach(bond => {
                    tableHtml += `
                        <tr>
                            <td>${bond.shortname || '—'}</td>
                            <td class="price-col">${bond.price ? bond.price.toFixed(2) : '—'}</td>
                            <td class="yield-col">${bond.yield ? bond.yield.toFixed(2) : '—'}</td>
                            <td class="coupon-col">${bond.couponValue ? bond.couponValue.toFixed(2) : '—'}</td>
                            <td class="maturity-col">${bond.maturityDate || '—'}</td>
                            <td class="type-col">${bond.bondTypeDisplay || '—'}</td>
                        </tr>
                    `;
                });
                tableHtml += '</tbody></table></div>';
                container.innerHTML = tableHtml;
            } else {
                throw new Error('Ответ не является массивом');
            }
        } catch(e) {
            container.innerHTML = `
                <div class="error-widget">
                    <i class="fas fa-exclamation-triangle"></i> Ошибка загрузки данных по облигациям
                    <button onclick="loadBonds()">Повторить</button>
                </div>
            `;
        }
    }

    // Привязка кнопок обновления
    document.getElementById('refreshKeyrateBtn')?.addEventListener('click', loadKeyRate);
    document.getElementById('refreshCurrencyBtn')?.addEventListener('click', loadCurrencyRates);
    document.getElementById('refreshBondsBtn')?.addEventListener('click', loadBonds);

    // Первичная загрузка данных
    loadKeyRate();
    loadCurrencyRates();
    loadBonds();
</script>
</body>
</html>
