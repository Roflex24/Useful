<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Динамика вакансий | График изменений</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --accent-1: #6c5ce7;
            --accent-2: #00cec9;
            --accent-3: #fd79a8;
            --accent-4: #fdcb6e;
            --accent-5: #55efc4;
            --shadow-soft: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            color: var(--text-primary);
        }

        /* Декоративные плавающие элементы */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: floatShape 20s infinite ease-in-out;
        }
        .shape-1 { width: 500px; height: 500px; background: var(--accent-1); top: -150px; left: -100px; }
        .shape-2 { width: 400px; height: 400px; background: var(--accent-2); bottom: -120px; right: -80px; animation-delay: 5s; }
        .shape-3 { width: 300px; height: 300px; background: var(--accent-3); top: 50%; left: 50%; animation-delay: 10s; }
        @keyframes floatShape {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .page-container {
            max-width: 1200px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Стеклянная карточка */
        .chart-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            overflow: hidden;
        }

        .chart-header {
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(0, 206, 201, 0.15));
            padding: 28px 32px;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, #e0e0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chart-header h1 i {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2rem;
            padding: 8px;
        }

        .subhead {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .refresh-area {
            position: absolute;
            top: 28px;
            right: 32px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .refresh-btn, .back-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .refresh-btn:hover, .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
        }

        .chart-body {
            padding: 30px;
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow-soft);
        }

        canvas {
            max-height: 420px;
            width: 100%;
        }

        /* Статистические карточки */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-top: 28px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            box-shadow: var(--shadow-soft);
            transition: transform 0.2s;
            color: var(--text-primary);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.4);
        }

        .stat-icon {
            font-size: 1.8rem;
            color: var(--accent-1);
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin-top: 6px;
        }

        .stat-trend {
            margin-top: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--accent-3);
        }

        /* Таблица */
        .data-table {
            margin-top: 28px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table h3 {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 18px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        td {
            font-size: 0.95rem;
        }

        .vacancy-number {
            font-weight: 800;
            color: #fff;
            font-size: 1.1rem;
        }

        /* Кнопка HH */
        .hh-link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(95deg, #ff7a45, #ff4d4f);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(255, 77, 79, 0.3);
            margin-top: 20px;
            width: 100%;
            border: none;
            cursor: pointer;
        }

        .hh-link-button i {
            font-size: 1.2rem;
        }

        .hh-link-button:hover {
            transform: translateY(-3px);
            background: linear-gradient(95deg, #ff5e2e, #e63e3e);
            box-shadow: 0 12px 28px rgba(255, 77, 79, 0.4);
        }

        /* Пустое состояние */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Лоадер */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            flex-direction: column;
            gap: 20px;
        }

        .loader i {
            color: var(--accent-2);
        }

        /* Ошибка */
        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.4);
            color: #fff;
            padding: 20px;
            border-radius: 24px;
            text-align: center;
            margin: 30px 0;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .chart-header {
                padding: 20px;
            }
            .refresh-area {
                position: static;
                margin-top: 15px;
            }
            .chart-header h1 {
                font-size: 1.5rem;
            }
            .chart-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
</div>

<div class="page-container">
    <div class="chart-card">
        <div class="chart-header">
            <h1>
                <i class="fas fa-chart-line"></i>
                Динамика количества вакансий
            </h1>
            <div class="subhead">
                <span><i class="fas fa-calendar-alt"></i> Анализ изменений по дням</span>
            </div>
            <div class="refresh-area">
                <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> На главную</a>
                <button id="refreshChartBtn" class="refresh-btn"><i class="fas fa-sync-alt"></i> Обновить</button>
            </div>
        </div>

        <div class="chart-body" id="chartBody">
            <div class="loader">
                <i class="fas fa-spinner fa-pulse fa-3x"></i>
                <p style="color: var(--text-secondary); font-weight:500;">Загрузка данных о вакансиях...</p>
            </div>
        </div>
    </div>
    <footer>
        <i class="fas fa-chart-simple"></i> График построен на основе данных сервера | Актуальность при каждом обновлении
    </footer>
</div>

<script>
    // Глобальная переменная для хранения экземпляра графика
    let vacanciesChart = null;

    const HH_VACANCY_URL = "https://nn.hh.ru/search/vacancy?text=Java+developer&from=suggest_post&salary=&ored_clusters=true&search_field=name&suggestId=8fff2cb4-38a4-45c9-9ac8-93435a4903c2&hhtmFrom=vacancy_search_list&hhtmFromLabel=vacancy_search_line";

    function formatDateLabel(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        const year = parts[0];
        const month = parseInt(parts[1], 10);
        const day = parseInt(parts[2], 10);
        const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
        return `${day} ${months[month-1]}`;
    }

    function formatFullDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        const year = parts[0];
        const month = parseInt(parts[1], 10);
        const day = parseInt(parts[2], 10);
        const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
        return `${day} ${months[month-1]} ${year}`;
    }

    function calculateStats(data) {
        if (!data || data.length === 0) return null;
        const counts = data.map(item => item.vacancyCount);
        const avg = counts.reduce((a,b) => a + b, 0) / counts.length;
        const max = Math.max(...counts);
        const min = Math.min(...counts);
        const last = counts[counts.length - 1];
        const first = counts[0];
        const change = last - first;
        const changePercent = first !== 0 ? (change / first) * 100 : 0;
        return {
            avg: avg.toFixed(1),
            max,
            min,
            first,
            last,
            change,
            changePercent: changePercent.toFixed(1)
        };
    }

    function renderDashboard(vacancyData) {
        const container = document.getElementById('chartBody');
        if (!vacancyData || vacancyData.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-chart-simple"></i>
                    <h3>Нет данных о вакансиях</h3>
                    <p>Сервер вернул пустой список. Попробуйте обновить позже.</p>
                    <button id="retryEmptyBtn" style="margin-top:20px; background: #667eea; border:none; padding:10px 30px; border-radius:40px; color:white; cursor:pointer;">
                        <i class="fas fa-sync-alt"></i> Повторить
                    </button>
                    <a href="${HH_VACANCY_URL}" target="_blank" class="hh-link-button" style="margin-top: 25px; display: inline-flex; width: auto;">
                        <i class="fab fa-hh"></i> Перейти к вакансиям Java-разработчика
                    </a>
                </div>
            `;
            const retryBtn = document.getElementById('retryEmptyBtn');
            if (retryBtn) retryBtn.addEventListener('click', () => fetchVacancyList());
            return;
        }

        const sortedData = [...vacancyData].sort((a,b) => new Date(a.date) - new Date(b.date));
        const dates = sortedData.map(item => formatDateLabel(item.date));
        const counts = sortedData.map(item => item.vacancyCount);
        const stats = calculateStats(sortedData);

        const html = `
            <div class="canvas-wrapper">
                <canvas id="vacancyLineChart" width="800" height="400" style="max-width:100%; height:auto; aspect-ratio:16/9;"></canvas>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-calculator"></i></div>
                    <div class="stat-label">Среднее за день</div>
                    <div class="stat-value">${stats.avg}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-arrow-trend-up"></i></div>
                    <div class="stat-label">Изменение (посл. - перв.)</div>
                    <div class="stat-value">${stats.change >= 0 ? '+' : ''}${stats.change.toLocaleString()}</div>
                    <div class="stat-trend">
                        ${stats.changePercent >= 0 ? '<i class="fas fa-arrow-up"></i>' : '<i class="fas fa-arrow-down"></i>'}
                        <span>${Math.abs(stats.changePercent)}%</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-chart-simple"></i></div>
                    <div class="stat-label">Диапазон (мин — макс)</div>
                    <div class="stat-value">${stats.min} — ${stats.max}</div>
                </div>
            </div>

            <div class="data-table">
                <h3><i class="fas fa-table-list"></i> Детальная динамика по дням</h3>
                <table>
                    <thead>
                        <tr><th>Дата</th><th>Количество вакансий</th><th>Изменение (к предыдущему)</th></tr>
                    </thead>
                    <tbody>
                        ${generateTableRows(sortedData)}
                    </tbody>
                </table>
            </div>

            <a href="${HH_VACANCY_URL}" target="_blank" class="hh-link-button">
                <i class="fab fa-hh"></i> Смотреть актуальные вакансии Java-разработчика на hh.ru
                <i class="fas fa-external-link-alt"></i>
            </a>
        `;

        container.innerHTML = html;

        const ctx = document.getElementById('vacancyLineChart').getContext('2d');
        if (vacanciesChart) {
            vacanciesChart.destroy();
        }

        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(102, 126, 234, 0.5)');
        gradient.addColorStop(1, 'rgba(102, 126, 234, 0.02)');

        vacanciesChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: 'Количество вакансий',
                        data: counts,
                        borderColor: '#4f46e5',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#ffffff',
                        pointRadius: 6,
                        pointHoverRadius: 9,
                        pointBorderWidth: 2,
                        tension: 0.2,
                        fill: true,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    tooltip: {
                        backgroundColor: '#1e293b',
                        titleColor: '#f1f5f9',
                        bodyColor: '#cbd5e1',
                        callbacks: {
                            label: function(context) {
                                let value = context.raw;
                                return `📊 Вакансий: ${value.toLocaleString()}`;
                            }
                        }
                    },
                    legend: {
                        position: 'top',
                        labels: {
                            font: { size: 13, weight: 'bold' },
                            color: '#ffffff',
                            usePointStyle: true,
                            boxWidth: 12,
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        ticks: {
                            callback: function(value) {
                                return value.toLocaleString() + ' шт.';
                            },
                            stepSize: 'auto',
                            color: '#ffffff'
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.1)',
                            drawBorder: true,
                        },
                        title: {
                            display: true,
                            text: 'Количество активных вакансий',
                            color: '#ffffff',
                            font: { weight: 'bold', size: 12 }
                        }
                    },
                    x: {
                        ticks: {
                            color: '#ffffff',
                            font: { size: 12 },
                            maxRotation: 35,
                            minRotation: 25
                        },
                        grid: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: 'Дата (по дням)',
                            color: '#ffffff',
                            font: { weight: 'bold', size: 12 }
                        }
                    }
                },
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                elements: {
                    line: {
                        borderJoin: 'round',
                    }
                }
            }
        });
    }

    function generateTableRows(sortedData) {
        if (!sortedData.length) return '<tr><td colspan="3">Нет данных</td></tr>';
        let rows = '';
        for (let i = 0; i < sortedData.length; i++) {
            const item = sortedData[i];
            const count = item.vacancyCount;
            const fullDate = formatFullDate(item.date);
            let changeHtml = '';
            if (i === 0) {
                changeHtml = '<span style="color:#94a3b8;"><i class="fas fa-minus-circle"></i> —</span>';
            } else {
                const prevCount = sortedData[i-1].vacancyCount;
                const diff = count - prevCount;
                const diffPercent = prevCount !== 0 ? (diff / prevCount) * 100 : 0;
                if (diff > 0) {
                    changeHtml = `<span style="color: #55efc4;"><i class="fas fa-arrow-up"></i> +${diff} (+${diffPercent.toFixed(1)}%)</span>`;
                } else if (diff < 0) {
                    changeHtml = `<span style="color: #ff7675;"><i class="fas fa-arrow-down"></i> ${diff} (${diffPercent.toFixed(1)}%)</span>`;
                } else {
                    changeHtml = `<span style="color: #fdcb6e;"><i class="fas fa-equals"></i> 0 (0%)</span>`;
                }
            }
            rows += `
                <tr>
                    <td style="font-weight:500;"><i class="far fa-calendar-alt" style="margin-right:8px; color:#6c5ce7;"></i> ${fullDate}</td>
                    <td class="vacancy-number">${count.toLocaleString()} <span style="font-size:0.7rem;">вакансий</span></td>
                    <td>${changeHtml}</td>
                </tr>
            `;
        }
        return rows;
    }

    async function fetchVacancyList() {
        const container = document.getElementById('chartBody');
        if (container) {
            container.innerHTML = `
                <div class="loader">
                    <i class="fas fa-spinner fa-pulse fa-3x"></i>
                    <p style="color: var(--text-secondary);">Загрузка данных с сервера...</p>
                </div>
            `;
        }

        try {
            const response = await fetch('http://localhost:8080/api/vacancy/list');
            if (!response.ok) {
                throw new Error(`HTTP ошибка: ${response.status} ${response.statusText}`);
            }
            const data = await response.json();

            if (!Array.isArray(data)) {
                throw new Error('Ответ сервера не является массивом');
            }

            const validData = data.filter(item =>
                item && typeof item === 'object' &&
                typeof item.date === 'string' &&
                typeof item.vacancyCount === 'number'
            );

            if (validData.length === 0) {
                renderDashboard([]);
                return;
            }

            renderDashboard(validData);

        } catch (error) {
            console.error('Ошибка при загрузке /api/vacancy/list:', error);
            const containerElem = document.getElementById('chartBody');
            if (containerElem) {
                containerElem.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 12px; display: inline-block;"></i>
                        <h3>Не удалось загрузить данные о вакансиях</h3>
                        <p>${error.message || 'Проверьте доступность сервера http://localhost:8080/api/vacancy/list'}</p>
                        <button id="retryFetchBtn" style="margin-top: 20px; background: #667eea; border: none; padding: 10px 28px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer;">
                            <i class="fas fa-redo-alt"></i> Повторить запрос
                        </button>
                        <a href="${HH_VACANCY_URL}" target="_blank" class="hh-link-button" style="margin-top: 25px; display: inline-flex; width: auto; background: #ff4d4f;">
                            <i class="fab fa-hh"></i> Перейти к вакансиям Java-разработчика
                        </a>
                    </div>
                `;
                const retryBtn = document.getElementById('retryFetchBtn');
                if (retryBtn) retryBtn.addEventListener('click', () => fetchVacancyList());
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchVacancyList();

        const refreshBtn = document.getElementById('refreshChartBtn');
        if (refreshBtn) {
            refreshBtn.addEventListener('click', (e) => {
                e.preventDefault();
                fetchVacancyList();
            });
        }
    });
</script>
</body>
</html>
