<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика портфеля</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg:        #060C1A;
            --surface:   rgba(255,255,255,0.042);
            --s-hover:   rgba(255,255,255,0.068);
            --border:    rgba(255,255,255,0.08);
            --border-lit:rgba(99,102,241,0.3);
            --indigo:    #6366F1;
            --emerald:   #10B981;
            --amber:     #F59E0B;
            --rose:      #F43F5E;
            --violet:    #8B5CF6;
            --sky:       #38BDF8;
            --text:      #F0F4FF;
            --text-2:    #B8C8E0;
            --text-3:    #6B7E99;
            --fd:        'Syne', sans-serif;
            --fu:        'Inter', sans-serif;
            --fn:        'JetBrains Mono', monospace;
            --r:         16px;
            --rl:        22px;
            --rxl:       30px;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { font-family:var(--fu); background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden; }

        /* Aurora */
        .aurora { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
        .ab { position:absolute; border-radius:50%; filter:blur(110px); animation:drift 22s ease-in-out infinite alternate; }
        .ab:nth-child(1) { width:600px;height:420px; background:radial-gradient(circle,#6366F1,transparent 70%); top:-100px;left:-60px; opacity:0.2; }
        .ab:nth-child(2) { width:460px;height:460px; background:radial-gradient(circle,#8B5CF6,transparent 70%); top:45%;right:-80px; opacity:0.13; animation-duration:28s; animation-delay:-9s; }
        .ab:nth-child(3) { width:360px;height:360px; background:radial-gradient(circle,#14B8A6,transparent 70%); bottom:-50px;left:42%; opacity:0.11; animation-duration:26s; animation-delay:-4s; }
        @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(45px,30px) scale(1.08)} }

        .layout { position:relative; z-index:1; max-width:1160px; margin:0 auto; padding:28px 22px 80px; }
        .glass { background:var(--surface); border:1px solid var(--border); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }

        /* Nav */
        .nav { display:flex; justify-content:space-between; align-items:center; padding:13px 20px; border-radius:var(--rl); margin-bottom:28px; gap:14px; flex-wrap:wrap; }
        .nav-brand { display:flex; align-items:center; gap:13px; }
        .nav-icon { width:40px;height:40px; border-radius:11px; background:linear-gradient(145deg,var(--violet),#7C3AED); display:flex;align-items:center;justify-content:center; color:#fff; font-size:0.95rem; box-shadow:0 0 0 1px rgba(139,92,246,0.38),0 6px 20px rgba(139,92,246,0.28); }
        .nav-title { font-family:var(--fd); font-size:1.25rem; font-weight:700; }
        .nav-sub { font-size:0.7rem; color:var(--text-3); margin-top:2px; }
        .btn-ghost { background:var(--surface); border:1px solid var(--border); color:var(--text-2); padding:8px 16px; border-radius:10px; font-family:var(--fu); font-size:0.8rem; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:7px; text-decoration:none; transition:all 0.18s; }
        .btn-ghost:hover { background:var(--s-hover); border-color:var(--border-lit); color:var(--text); }

        /* Hero */
        .hero { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; border-radius:var(--rxl); overflow:hidden; margin-bottom:24px; border:1px solid var(--border); }
        @media(max-width:660px) { .hero { grid-template-columns:1fr; } }
        .hero-cell { padding:28px 26px; background:var(--surface); backdrop-filter:blur(18px); }
        .hero-cell:not(:last-child) { border-right:1px solid var(--border); }
        @media(max-width:660px) { .hero-cell:not(:last-child) { border-right:none; border-bottom:1px solid var(--border); } }
        .hc-label { font-size:0.68rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-3); margin-bottom:10px; display:flex; align-items:center; gap:7px; }
        .hc-val { font-family:var(--fn); font-size:clamp(1.5rem,3.5vw,2.2rem); font-weight:700; letter-spacing:-0.025em; line-height:1; }
        .hc-sub { font-size:0.72rem; color:var(--text-3); margin-top:6px; }
        .hc-dot { width:8px;height:8px; border-radius:50%; flex-shrink:0; }

        /* Two-col */
        .two-col { display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start; margin-bottom:18px; }
        @media(max-width:840px) { .two-col { grid-template-columns:1fr; } }

        /* Panel */
        .panel { border-radius:var(--rl); padding:22px; margin-bottom:18px; }
        .panel-title { font-family:var(--fd); font-size:0.9rem; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:9px; }
        .panel-title i { font-size:0.85rem; color:var(--violet); }

        /* Bank rows */
        .bank-row { display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--border); }
        .bank-row:last-child { border-bottom:none; }
        .bank-avatar { width:36px;height:36px; border-radius:10px; background:var(--surface); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; font-size:0.78rem; font-weight:700; color:var(--text-2); flex-shrink:0; font-family:var(--fn); }
        .bank-name { font-size:0.86rem; font-weight:600; flex:1; }
        .bank-right { text-align:right; }
        .bank-amt { font-family:var(--fn); font-size:0.9rem; font-weight:600; }
        .bank-pct { font-size:0.7rem; color:var(--text-3); margin-top:2px; }
        .bank-bar-wrap { height:3px; border-radius:999px; background:rgba(255,255,255,0.07); margin-top:8px; overflow:hidden; }
        .bank-bar { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--indigo),var(--violet)); }

        /* Type pills */
        .type-row { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
        .type-row:last-child { border-bottom:none; }
        .type-icon { width:34px;height:34px; border-radius:9px; display:flex;align-items:center;justify-content:center; font-size:0.82rem; flex-shrink:0; }
        .type-name { font-size:0.84rem; font-weight:600; flex:1; }
        .type-amt  { font-family:var(--fn); font-size:0.88rem; font-weight:600; text-align:right; }
        .type-pct  { font-size:0.7rem; color:var(--text-3); text-align:right; margin-top:2px; }

        /* Donut */
        .donut-wrap { position:relative; width:170px;height:170px; margin:0 auto 18px; }
        .donut-center { position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center; }
        .dc-val { font-family:var(--fn); font-size:1.1rem; font-weight:700; }
        .dc-lbl { font-size:0.64rem; color:var(--text-3); margin-top:2px; }

        /* Insight cards */
        .insight-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media(max-width:500px) { .insight-grid { grid-template-columns:1fr; } }
        .insight-card { padding:16px; border-radius:var(--r); border:1px solid var(--border); background:rgba(255,255,255,0.022); }
        .ic-icon { font-size:1.1rem; margin-bottom:8px; }
        .ic-label { font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:4px; }
        .ic-val { font-family:var(--fn); font-size:1.05rem; font-weight:700; }
        .ic-sub { font-size:0.7rem; color:var(--text-3); margin-top:3px; line-height:1.4; }

        /* Score bar */
        .score-row { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--border); }
        .score-row:last-child { border-bottom:none; }
        .score-name { font-size:0.8rem; color:var(--text-2); width:120px; flex-shrink:0; }
        .score-track { flex:1; height:6px; border-radius:999px; background:rgba(255,255,255,0.07); overflow:hidden; }
        .score-fill { height:100%; border-radius:999px; transition:width 0.6s cubic-bezier(0.23,1,0.32,1); }
        .score-num { font-family:var(--fn); font-size:0.78rem; font-weight:600; width:36px; text-align:right; flex-shrink:0; }

        /* Verdict */
        .verdict { display:flex; align-items:flex-start; gap:16px; padding:18px 20px; border-radius:var(--r); border:1px solid; }
        .verdict-icon { font-size:1.4rem; flex-shrink:0; margin-top:1px; }
        .verdict-title { font-family:var(--fd); font-size:0.9rem; font-weight:700; margin-bottom:4px; }
        .verdict-text { font-size:0.8rem; color:var(--text-2); line-height:1.6; }
        .v-ok   { border-color:rgba(16,185,129,0.25); background:rgba(16,185,129,0.06); }
        .v-warn { border-color:rgba(245,158,11,0.25);  background:rgba(245,158,11,0.06); }
        .v-bad  { border-color:rgba(244,63,94,0.2);    background:rgba(244,63,94,0.05); }

        /* Toast */
        .toasts { position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:8px; }
        .toast { display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:var(--r);border:1px solid var(--border);background:rgba(11,19,38,0.95);backdrop-filter:blur(18px);font-size:0.8rem;font-weight:500;animation:tin 0.25s ease; }
        @keyframes tin { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
        .toast.e { border-color:rgba(244,63,94,0.3);color:var(--rose); }
    </style>
</head>
<body>

<div class="aurora"><div class="ab"></div><div class="ab"></div><div class="ab"></div></div>
<div class="toasts" id="toasts"></div>

<div class="layout">

    <!-- Nav -->
    <nav class="nav glass">
        <div class="nav-brand">
            <div class="nav-icon"><i class="fas fa-chart-pie"></i></div>
            <div>
                <div class="nav-title">Аналитика портфеля</div>
                <div class="nav-sub">На основе ваших реальных данных</div>
            </div>
        </div>
        <a href="finance.html" class="btn-ghost"><i class="fas fa-arrow-left"></i> Назад к финансам</a>
    </nav>

    <!-- Hero: 3 главных числа -->
    <div class="hero" id="heroBlock">
        <div class="hero-cell">
            <div class="hc-label"><div class="hc-dot" style="background:var(--violet)"></div> Общий капитал</div>
            <div class="hc-val" id="hTotal" style="background:linear-gradient(135deg,#fff 30%,#C4B5FD);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">—</div>
            <div class="hc-sub" id="hTotalSub">загрузка…</div>
        </div>
        <div class="hero-cell">
            <div class="hc-label"><div class="hc-dot" style="background:var(--emerald)"></div> Наличные и карты</div>
            <div class="hc-val" id="hCard" style="color:var(--emerald)">—</div>
            <div class="hc-sub" id="hCardPct">—% от портфеля</div>
        </div>
        <div class="hero-cell">
            <div class="hc-label"><div class="hc-dot" style="background:var(--amber)"></div> В работе (депозиты + инвест.)</div>
            <div class="hc-val" id="hWork" style="color:var(--amber)">—</div>
            <div class="hc-sub" id="hWorkPct">—% от портфеля</div>
        </div>
    </div>

    <div class="two-col">

        <!-- LEFT -->
        <div>

            <!-- По банкам -->
            <div class="panel glass">
                <div class="panel-title"><i class="fas fa-building-columns"></i> Распределение по банкам</div>
                <div id="bankList">—</div>
            </div>

            <!-- Вердикт -->
            <div id="verdictBlock"></div>

        </div>

        <!-- RIGHT -->
        <div>

            <!-- Donut + типы -->
            <div class="panel glass">
                <div class="panel-title"><i class="fas fa-circle-half-stroke"></i> Структура портфеля</div>
                <div class="donut-wrap">
                    <canvas id="donut"></canvas>
                    <div class="donut-center">
                        <div class="dc-val" id="dcVal">—</div>
                        <div class="dc-lbl">счетов</div>
                    </div>
                </div>
                <div id="typeList"></div>
            </div>

            <!-- Показатели -->
            <div class="panel glass">
                <div class="panel-title"><i class="fas fa-sliders"></i> Показатели</div>
                <div id="scoreList"></div>
            </div>

        </div>
    </div>

    <!-- Инсайты -->
    <div class="panel glass" style="margin-bottom:0">
        <div class="panel-title"><i class="fas fa-lightbulb"></i> Ключевые наблюдения</div>
        <div class="insight-grid" id="insightGrid"></div>
    </div>

</div>

<script>
    const API_BASE = 'http://localhost:8080/api/finance';
    let donutChart = null;

    function fmtFull(n) {
        return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(parseFloat(n)||0);
    }
    function fmtShort(n) {
        const v = parseFloat(n)||0;
        if (v >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'') + ' млн ₽';
        if (v >= 1e3) return (v/1e3).toFixed(0) + ' тыс ₽';
        return v.toFixed(0) + ' ₽';
    }
    function pct(a, b) { return b ? ((a/b)*100).toFixed(1) : '0.0'; }

    function toast(msg) {
        const el = document.createElement('div');
        el.className = 'toast e';
        el.innerHTML = '<i class="fas fa-circle-exclamation"></i> ' + msg;
        document.getElementById('toasts').appendChild(el);
        setTimeout(function(){ el.remove(); }, 3500);
    }

    async function load() {
        let summary, accounts;
        try {
            const [r1, r2] = await Promise.all([
                fetch(API_BASE + '/summary'),
                fetch(API_BASE + '/accounts')
            ]);
            if (!r1.ok || !r2.ok) throw new Error();
            summary  = await r1.json();
            accounts = await r2.json();
        } catch(e) {
            toast('Нет связи с API — демо-данные');
            summary = {
                totalAmount: 1240000,
                amountByType: { CARD: 320000, DEPOSIT: 780000, INVESTMENT: 140000 },
                amountByBank: { 'Сбербанк': 540000, 'Тинькофф': 420000, 'Альфа-Банк': 280000 }
            };
            accounts = [];
        }
        render(summary, accounts);
    }

    function render(s, accounts) {
        const total    = parseFloat(s.totalAmount) || 0;
        const byType   = s.amountByType   || {};
        const byBank   = s.amountByBank   || {};

        const card   = parseFloat(byType['CARD']       || byType['Карты']    || 0);
        const dep    = parseFloat(byType['DEPOSIT']     || byType['Депозит']  || 0);
        const inv    = parseFloat(byType['INVESTMENT']  || byType['Инвест']   || 0);
        const inWork = dep + inv;

        const bankCount    = Object.keys(byBank).length;
        const accountCount = accounts.length || Object.keys(byBank).length;

        /* ── Hero ── */
        document.getElementById('hTotal').textContent   = fmtFull(total);
        document.getElementById('hTotalSub').textContent = bankCount + ' ' + plural(bankCount,'банк','банка','банков') + ', ' + accountCount + ' ' + plural(accountCount,'счёт','счёта','счетов');
        document.getElementById('hCard').textContent    = fmtShort(card);
        document.getElementById('hCardPct').textContent = pct(card, total) + '% от портфеля';
        document.getElementById('hWork').textContent    = fmtShort(inWork);
        document.getElementById('hWorkPct').textContent = pct(inWork, total) + '% от портфеля';

        /* ── Banks ── */
        const banks = Object.entries(byBank).sort(function(a,b){ return b[1]-a[1]; });
        const maxBank = banks.length ? banks[0][1] : 1;
        document.getElementById('bankList').innerHTML = banks.map(function(entry, idx) {
            const name = entry[0], amt = parseFloat(entry[1]);
            const initials = name.split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
            const barW = ((amt / maxBank) * 100).toFixed(0);
            const share = pct(amt, total);
            return '<div class="bank-row">' +
                '<div class="bank-avatar">' + initials + '</div>' +
                '<div style="flex:1">' +
                '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
                '<span class="bank-name">' + name + '</span>' +
                '<span style="font-family:var(--fn);font-size:0.88rem;font-weight:600">' + fmtShort(amt) + '</span>' +
                '</div>' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">' +
                '<span style="font-size:0.7rem;color:var(--text-3)">' + share + '% портфеля</span>' +
                '</div>' +
                '<div class="bank-bar-wrap"><div class="bank-bar" style="width:' + barW + '%;background:hsl(' + (220 + idx*30) + ',70%,62%)"></div></div>' +
                '</div>' +
                '</div>';
        }).join('');

        /* ── Donut ── */
        const typeConfig = [
            { key:'CARD',       label:'Карты',      color:'#10B981', icon:'fas fa-credit-card',   val:card },
            { key:'DEPOSIT',    label:'Депозиты',   color:'#6366F1', icon:'fas fa-piggy-bank',    val:dep  },
            { key:'INVESTMENT', label:'Инвестиции', color:'#F59E0B', icon:'fas fa-chart-line',    val:inv  },
        ].filter(function(t){ return t.val > 0; });

        document.getElementById('dcVal').textContent = accountCount;

        if (!donutChart) {
            const ctx = document.getElementById('donut').getContext('2d');
            donutChart = new Chart(ctx, {
                type:'doughnut',
                data:{
                    labels: typeConfig.map(function(t){ return t.label; }),
                    datasets:[{ data: typeConfig.map(function(t){ return t.val; }), backgroundColor: typeConfig.map(function(t){ return t.color; }), borderColor:'#060C1A', borderWidth:3, hoverOffset:4 }]
                },
                options:{ plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){ return c.label+': '+fmtShort(c.raw); }}}}, cutout:'64%', animation:{duration:500} }
            });
        } else {
            donutChart.data.labels = typeConfig.map(function(t){ return t.label; });
            donutChart.data.datasets[0].data = typeConfig.map(function(t){ return t.val; });
            donutChart.data.datasets[0].backgroundColor = typeConfig.map(function(t){ return t.color; });
            donutChart.update();
        }

        document.getElementById('typeList').innerHTML = typeConfig.map(function(t) {
            return '<div class="type-row">' +
                '<div class="type-icon" style="background:' + t.color + '1A;color:' + t.color + '"><i class="' + t.icon + '"></i></div>' +
                '<div class="type-name">' + t.label + '</div>' +
                '<div><div class="type-amt">' + fmtShort(t.val) + '</div><div class="type-pct">' + pct(t.val,total) + '%</div></div>' +
                '</div>';
        }).join('');

        /* ── Scores ── */
        const liquidityScore    = Math.min(100, Math.round((card / total) * 200));
        const diversityScore    = Math.min(100, bankCount * 25 + typeConfig.length * 15);
        const savingsScore      = Math.min(100, Math.round((dep / total) * 200));
        const investmentScore   = Math.min(100, Math.round((inv  / total) * 300));

        const scores = [
            { name:'Ликвидность',    val:liquidityScore,  color:'#10B981' },
            { name:'Диверсификация', val:diversityScore,  color:'#8B5CF6' },
            { name:'Накопления',     val:savingsScore,    color:'#6366F1' },
            { name:'Инвестиции',     val:investmentScore, color:'#F59E0B' },
        ];
        document.getElementById('scoreList').innerHTML = scores.map(function(sc) {
            return '<div class="score-row">' +
                '<span class="score-name">' + sc.name + '</span>' +
                '<div class="score-track"><div class="score-fill" style="width:' + sc.val + '%;background:' + sc.color + '"></div></div>' +
                '<span class="score-num" style="color:' + sc.color + '">' + sc.val + '</span>' +
                '</div>';
        }).join('');

        /* ── Insights ── */
        const cardPct  = total ? card/total : 0;
        const depPct   = total ? dep/total  : 0;
        const invPct   = total ? inv/total  : 0;

        const insights = [];

        insights.push({
            icon:'🏦',
            label:'Банков',
            val: bankCount + ' ' + plural(bankCount,'банк','банка','банков'),
            sub: bankCount === 1 ? 'Все средства в одном банке — риск концентрации' :
                bankCount === 2 ? 'Два банка — минимальная диверсификация' :
                    'Хорошее распределение по банкам'
        });

        insights.push({
            icon:'💧',
            label:'Доля ликвидных',
            val: pct(card, total) + '%',
            sub: cardPct < 0.05 ? 'Мало свободных средств — резерв ниже нормы' :
                cardPct > 0.50  ? 'Слишком много наличных — деньги не работают' :
                    'Комфортный уровень ликвидности'
        });

        insights.push({
            icon:'🔒',
            label:'Депозиты',
            val: pct(dep, total) + '%',
            sub: depPct < 0.15 ? 'Мало средств на депозитах' :
                depPct > 0.80  ? 'Почти весь капитал в депозитах — низкий рост' :
                    'Хорошая доля в депозитах'
        });

        insights.push({
            icon:'📈',
            label:'Инвестиции',
            val: pct(inv, total) + '%',
            sub: invPct === 0    ? 'Нет инвестиционных активов' :
                invPct < 0.10   ? 'Небольшая доля — есть куда расти' :
                    invPct > 0.60   ? 'Высокая доля инвестиций — следите за риском' :
                        'Здоровая доля инвестиций'
        });

        document.getElementById('insightGrid').innerHTML = insights.map(function(ins) {
            return '<div class="insight-card">' +
                '<div class="ic-icon">' + ins.icon + '</div>' +
                '<div class="ic-label">' + ins.label + '</div>' +
                '<div class="ic-val">' + ins.val + '</div>' +
                '<div class="ic-sub">' + ins.sub + '</div>' +
                '</div>';
        }).join('');

        /* ── Verdict ── */
        const overallScore = Math.round((liquidityScore + diversityScore + savingsScore + investmentScore) / 4);
        let vClass, vIcon, vTitle, vText;
        if (overallScore >= 65) {
            vClass = 'v-ok'; vIcon = '✅';
            vTitle = 'Портфель в хорошем состоянии';
            vText  = 'Средства распределены разумно. Диверсификация по банкам и типам активов на приемлемом уровне.';
        } else if (overallScore >= 35) {
            vClass = 'v-warn'; vIcon = '⚠️';
            vTitle = 'Есть что улучшить';
            vText  = 'Портфель работает, но отдельные показатели ниже нормы. Обратите внимание на наблюдения ниже.';
        } else {
            vClass = 'v-bad'; vIcon = '🔴';
            vTitle = 'Портфель требует внимания';
            vText  = 'Низкая диверсификация или дисбаланс активов. Стоит пересмотреть распределение средств.';
        }
        document.getElementById('verdictBlock').innerHTML =
            '<div class="verdict ' + vClass + '" style="margin-bottom:18px">' +
            '<div class="verdict-icon">' + vIcon + '</div>' +
            '<div><div class="verdict-title">' + vTitle + '</div><div class="verdict-text">' + vText + '</div></div>' +
            '</div>';
    }

    function plural(n, one, few, many) {
        const mod10 = n % 10, mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return one;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
        return many;
    }

    load();
</script>
</body>
</html>
