<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/atom-one-dark.min.css"/>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>

    <style>
        :root {
            --bg: #0b0e14;
            --bg-soft: #11151f;
            --panel: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text: #e8eaf0;
            --text-dim: #9aa1b2;
            --accent: #7c6cff;
            --accent-2: #4ecdc4;
            --user-bubble: linear-gradient(135deg, #6a5cff, #8f6bff);
            --ai-bubble: rgba(255, 255, 255, 0.06);
            --code-bg: #161a25;
            --radius: 18px;
            --sidebar-w: 268px;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(600px circle at 15% 10%, rgba(124, 108, 255, 0.15), transparent 60%),
                radial-gradient(700px circle at 85% 90%, rgba(78, 205, 196, 0.10), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative; z-index: 2;
            display: flex; align-items: center; gap: 12px;
            padding: 14px 24px;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(11, 14, 20, 0.7);
            backdrop-filter: blur(12px);
        }

        .logo {
            width: 36px; height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: grid; place-items: center;
            font-weight: 700; font-size: 18px; color: #fff;
            box-shadow: 0 4px 16px rgba(124, 108, 255, 0.4);
        }

        header h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
        header .actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }

        .status {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px; color: var(--text-dim);
        }
        header .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #3ddc84; box-shadow: 0 0 8px rgba(61, 220, 132, 0.8);
            transition: background .2s, box-shadow .2s;
        }
        header .dot.busy    { background: #ffb454; box-shadow: 0 0 8px rgba(255, 180, 84, 0.8); }
        header .dot.offline { background: #ff5050; box-shadow: 0 0 8px rgba(255, 80, 80, 0.8); }

        .icon-btn {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: var(--text-dim);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: color .2s, border-color .2s;
        }
        .icon-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .icon-btn:disabled { opacity: .5; cursor: not-allowed; }

        .menu-btn { display: none; }

        .layout { flex: 1; display: flex; overflow: hidden; position: relative; z-index: 1; }

        /* ===== Sidebar ===== */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 8px;
            border-right: 1px solid var(--panel-border);
            background: rgba(11, 14, 20, 0.55);
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            background: var(--panel);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all .2s;
        }
        .new-chat-btn:hover {
            border-color: var(--accent);
            background: rgba(124, 108, 255, 0.12);
            color: #fff;
        }

        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-dim);
            padding: 8px 6px 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-title .refresh {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            border-radius: 6px;
        }
        .sidebar-title .refresh:hover { color: var(--text); background: var(--panel); }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 0 -4px;
            padding: 0 4px;
        }
        .chat-list::-webkit-scrollbar { width: 6px; }
        .chat-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-dim);
            transition: background .15s, color .15s;
            user-select: none;
        }
        .chat-item:hover { background: var(--panel); color: var(--text); }
        .chat-item.active {
            background: rgba(124, 108, 255, 0.15);
            color: var(--text);
            box-shadow: inset 0 0 0 1px rgba(124, 108, 255, 0.25);
        }

        .chat-item .title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item .del {
            opacity: 0;
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 3px 7px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1;
            font-family: inherit;
            transition: opacity .15s, color .15s, background .15s;
        }
        .chat-item:hover .del { opacity: 1; }
        .chat-item .del:hover { color: #ff6b6b; background: rgba(255, 107, 107, 0.12); }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9;
        }

        /* ===== Chat area ===== */
        .chat-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            scroll-behavior: smooth;
        }

        #output {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message { display: flex; gap: 10px; align-items: flex-start; animation: appear 0.3s ease both; }
        @keyframes appear {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .message.user { flex-direction: row-reverse; }

        .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: grid; place-items: center;
            font-size: 12px; font-weight: 600; color: #fff;
        }
        .message.user .avatar { background: linear-gradient(135deg, #6a5cff, #8f6bff); }
        .message.ai   .avatar { background: linear-gradient(135deg, #4ecdc4, #2b9eb3); }

        .msg-body { display: flex; flex-direction: column; gap: 6px; max-width: 78%; }
        .message.user .msg-body { align-items: flex-end; }

        .bubble {
            padding: 12px 16px;
            border-radius: var(--radius);
            line-height: 1.55;
            font-size: 15px;
            border: 1px solid var(--panel-border);
            overflow-wrap: break-word;
        }

        .message.user .bubble {
            background: var(--user-bubble);
            border: none;
            color: #fff;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 20px rgba(106, 92, 255, 0.25);
            white-space: pre-wrap;
        }
        .message.ai .bubble {
            background: var(--ai-bubble);
            backdrop-filter: blur(8px);
            border-bottom-left-radius: 6px;
        }

        /* ===== Markdown ===== */
        .bubble.md > *:first-child { margin-top: 0; }
        .bubble.md > *:last-child  { margin-bottom: 0; }
        .bubble.md p { margin: 8px 0; }
        .bubble.md h1, .bubble.md h2, .bubble.md h3,
        .bubble.md h4, .bubble.md h5, .bubble.md h6 { margin: 16px 0 8px; line-height: 1.3; }
        .bubble.md h1 { font-size: 1.35em; }
        .bubble.md h2 { font-size: 1.2em; }
        .bubble.md h3 { font-size: 1.08em; }
        .bubble.md ul, .bubble.md ol { margin: 8px 0; padding-left: 24px; }
        .bubble.md li { margin: 4px 0; }
        .bubble.md a { color: var(--accent-2); }
        .bubble.md blockquote {
            margin: 10px 0; padding: 4px 14px;
            border-left: 3px solid var(--accent);
            background: rgba(124, 108, 255, 0.08);
            border-radius: 0 8px 8px 0;
            color: var(--text-dim);
        }
        .bubble.md table {
            border-collapse: collapse; margin: 10px 0; width: 100%;
            font-size: 14px; display: block; overflow-x: auto;
        }
        .bubble.md th, .bubble.md td {
            border: 1px solid var(--panel-border);
            padding: 7px 12px; text-align: left;
        }
        .bubble.md th { background: rgba(255,255,255,0.05); }
        .bubble.md hr { border: none; border-top: 1px solid var(--panel-border); margin: 14px 0; }
        .bubble.md :not(pre) > code {
            background: rgba(124, 108, 255, 0.15);
            color: #c9c2ff;
            padding: 2px 6px; border-radius: 6px;
            font-size: 0.88em;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        }

        /* ===== Code blocks ===== */
        .code-block {
            margin: 12px 0; border-radius: 12px; overflow: hidden;
            border: 1px solid var(--panel-border); background: var(--code-bg);
        }
        .code-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 12px; color: var(--text-dim);
        }
        .copy-btn {
            background: transparent; border: 1px solid var(--panel-border);
            color: var(--text-dim); border-radius: 7px;
            padding: 3px 10px; font-size: 12px; cursor: pointer;
            font-family: inherit; transition: all .2s;
        }
        .copy-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
        .copy-btn.copied { color: var(--accent-2); border-color: var(--accent-2); }
        .code-block pre {
            margin: 0; padding: 14px; overflow-x: auto;
            font-size: 13.5px; line-height: 1.55;
        }
        .code-block code {
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            background: none !important; padding: 0 !important;
        }

        .bubble.streaming::after {
            content: '▍'; margin-left: 2px; color: var(--accent-2);
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .msg-actions { display: flex; gap: 6px; opacity: 0; transition: opacity .2s; }
        .message.ai:hover .msg-actions { opacity: 1; }
        .msg-actions button {
            background: transparent; border: none; color: var(--text-dim);
            font-size: 12px; cursor: pointer; padding: 4px 8px;
            border-radius: 8px; font-family: inherit;
        }
        .msg-actions button:hover { background: var(--panel); color: var(--text); }

        .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; }
        .empty .icon { font-size: 42px; margin-bottom: 12px; }
        .empty h2 { font-size: 20px; font-weight: 600; color: var(--text); margin: 0 0 6px; }
        .empty p { margin: 0 0 20px; font-size: 14px; }

        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .suggestions button {
            background: var(--panel); border: 1px solid var(--panel-border);
            color: var(--text-dim); border-radius: 20px;
            padding: 8px 16px; font-size: 13px; cursor: pointer;
            font-family: inherit; transition: all .2s;
        }
        .suggestions button:hover {
            color: var(--text); border-color: var(--accent);
            background: rgba(124, 108, 255, 0.1);
        }

        #scrollDown {
            position: fixed; bottom: 110px; left: calc(50% + var(--sidebar-w) / 2);
            transform: translateX(-50%);
            z-index: 5; width: 40px; height: 40px;
            border-radius: 50%; border: 1px solid var(--panel-border);
            background: var(--bg-soft); color: var(--text);
            cursor: pointer; display: none; place-items: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        #scrollDown.visible { display: grid; }

        footer {
            position: relative;
            padding: 16px 16px 20px;
            background: linear-gradient(to top, var(--bg) 60%, transparent);
        }

        form {
            max-width: 760px; margin: 0 auto;
            display: flex; align-items: flex-end; gap: 10px;
            background: var(--bg-soft);
            border: 1px solid var(--panel-border);
            border-radius: 16px; padding: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        form:focus-within {
            border-color: rgba(124, 108, 255, 0.5);
            box-shadow: 0 0 0 4px rgba(124, 108, 255, 0.12);
        }

        textarea {
            flex: 1; padding: 12px 14px; font-size: 15px;
            font-family: inherit; background: transparent;
            border: none; outline: none; color: var(--text);
            resize: none; max-height: 180px; line-height: 1.5;
        }
        textarea::placeholder { color: var(--text-dim); }

        form button {
            padding: 12px 22px; font-size: 15px; font-weight: 600;
            font-family: inherit; cursor: pointer; border: none;
            border-radius: 12px; color: #fff;
            background: linear-gradient(135deg, var(--accent), #9d7bff);
            box-shadow: 0 4px 16px rgba(124, 108, 255, 0.35);
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            flex-shrink: 0;
        }
        form button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(124, 108, 255, 0.45);
        }
        form button:active:not(:disabled) { transform: translateY(0); }
        form button:disabled { opacity: 0.5; cursor: not-allowed; }

        #stopBtn {
            display: none;
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid rgba(255, 80, 80, 0.4);
            box-shadow: none;
        }
        #stopBtn:hover { background: rgba(255, 80, 80, 0.25); box-shadow: none; }

        footer .hint {
            max-width: 760px; margin: 8px auto 0;
            text-align: center; font-size: 12px; color: var(--text-dim);
        }
        footer .hint kbd {
            background: var(--panel); border: 1px solid var(--panel-border);
            border-radius: 5px; padding: 1px 6px;
            font-family: inherit; font-size: 11px;
        }

        main::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
        main::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        @media (max-width: 780px) {
            .sidebar {
                position: absolute; top: 0; bottom: 0; left: 0;
                transform: translateX(-100%);
                transition: transform .25s ease;
                z-index: 10;
                background: var(--bg-soft);
                width: min(280px, 85vw);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-backdrop.visible { display: block; }
            .menu-btn { display: inline-block; }
            #scrollDown { left: 50%; }
        }

        @media (max-width: 600px) {
            .msg-body { max-width: 88%; }
            form button { padding: 12px 16px; }
            footer .hint { display: none; }
        }
    </style>
</head>
<body>

<header>
    <button class="icon-btn menu-btn" id="menuBtn" title="Меню чатов">☰</button>
    <div class="logo">AI</div>
    <h1>AI Chat</h1>
    <div class="actions">
        <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">онлайн</span></div>
        <button class="icon-btn" id="clearBtn" title="Очистить текущий чат">🗑 Очистить</button>
    </div>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <button class="new-chat-btn" id="newChatBtn"><span>＋</span> Новый чат</button>
        <div class="sidebar-title">
            <span>История</span>
            <button class="refresh" id="refreshBtn" title="Обновить список">⟳</button>
        </div>
        <div class="chat-list" id="chatList"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <section class="chat-area">
        <main id="chatScroll">
            <div id="output"></div>
        </main>
        <button id="scrollDown" title="Вниз">↓</button>
        <footer>
            <form id="chatForm">
                <textarea id="prompt" rows="1" autocomplete="off" placeholder="Спроси что-нибудь..."></textarea>
                <button type="submit" id="sendBtn">Отправить</button>
                <button type="button" id="stopBtn">⏹ Стоп</button>
            </form>
            <div class="hint"><kbd>Enter</kbd> — отправить · <kbd>Shift</kbd>+<kbd>Enter</kbd> — новая строка</div>
        </footer>
    </section>
</div>

<script>
    // ===== Markdown =====
    marked.setOptions({
        gfm: true,
        breaks: true,
        highlight: (code, lang) => {
            if (lang && hljs.getLanguage(lang)) {
                return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
        }
    });

    const output     = document.getElementById('output');
    const scrollArea = document.getElementById('chatScroll');
    const form       = document.getElementById('chatForm');
    const input      = document.getElementById('prompt');
    const sendBtn    = document.getElementById('sendBtn');
    const stopBtn    = document.getElementById('stopBtn');
    const clearBtn   = document.getElementById('clearBtn');
    const scrollDown = document.getElementById('scrollDown');
    const statusDot  = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const sidebar    = document.getElementById('sidebar');
    const sidebarBd  = document.getElementById('sidebarBackdrop');
    const chatList   = document.getElementById('chatList');
    const newChatBtn = document.getElementById('newChatBtn');
    const menuBtn    = document.getElementById('menuBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    const ACTIVE_KEY = 'ai-chat-active-v3';

    let controller = null;
    let streaming  = false;
    let sessions   = [];   // список с бэка
    let activeId   = null;

    // ===== API =====
    async function apiListSessions() {
        const r = await fetch('/chat/sessions');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    }
    async function apiCreateSession(title) {
        const r = await fetch('/chat/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title || null })
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    }
    async function apiDeleteSession(id) {
        await fetch('/chat/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
    }

    // ===== Sidebar =====
    function renderSidebar() {
        chatList.innerHTML = '';
        sessions.forEach(s => {
            const el = document.createElement('div');
            el.className = 'chat-item' + (s.id === activeId ? ' active' : '');
            el.dataset.id = s.id;

            const title = document.createElement('span');
            title.className = 'title';
            title.textContent = s.title || 'Новый чат';

            const del = document.createElement('button');
            del.className = 'del';
            del.textContent = '✕';
            del.title = 'Удалить чат';
            del.addEventListener('click', (e) => {
                e.stopPropagation();
                removeChat(s.id);
            });

            el.appendChild(title);
            el.appendChild(del);
            el.addEventListener('click', () => switchChat(s.id));
            chatList.appendChild(el);
        });
    }

    function openSidebar()  { sidebar.classList.add('open'); sidebarBd.classList.add('visible'); }
    function closeSidebar() { sidebar.classList.remove('open'); sidebarBd.classList.remove('visible'); }

    async function refreshSessions() {
        try {
            sessions = await apiListSessions();
            renderSidebar();
        } catch (e) {
            console.warn('Не удалось получить список чатов:', e);
        }
    }

    // ===== Статус =====
    function setStatus(state) {
        statusDot.classList.remove('busy', 'offline');
        if (state === 'busy')         { statusDot.classList.add('busy');    statusText.textContent = 'печатает…'; }
        else if (state === 'offline') { statusDot.classList.add('offline'); statusText.textContent = 'офлайн'; }
        else                          { statusText.textContent = 'онлайн'; }
    }

    // ===== Скролл =====
    function scrollToBottom(force = false) {
        const near = scrollArea.scrollHeight - scrollArea.scrollTop - scrollArea.clientHeight < 150;
        if (near || force) scrollArea.scrollTop = scrollArea.scrollHeight;
    }
    scrollArea.addEventListener('scroll', () => {
        const near = scrollArea.scrollHeight - scrollArea.scrollTop - scrollArea.clientHeight < 150;
        scrollDown.classList.toggle('visible', !near);
    });
    scrollDown.addEventListener('click', () => {
        scrollArea.scrollTop = scrollArea.scrollHeight;
        scrollDown.classList.remove('visible');
    });

    // ===== Markdown рендер =====
    function sanitize(md) {
        return DOMPurify.sanitize(marked.parse(md), { ADD_ATTR: ['class', 'language'] });
    }
    function renderMarkdown(container, rawText) {
        container.classList.add('md');
        container.innerHTML = sanitize(rawText);
        container.querySelectorAll('pre > code').forEach(codeEl => {
            const pre = codeEl.parentElement;
            const lang = (codeEl.className.match(/language-(\w+)/) || [])[1] || 'код';
            const wrapper = document.createElement('div');
            wrapper.className = 'code-block';

            const header = document.createElement('div');
            header.className = 'code-header';
            header.innerHTML = `<span>${lang}</span>`;

            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'Копировать';
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText(codeEl.textContent).then(() => {
                    btn.textContent = '✓ Скопировано';
                    btn.classList.add('copied');
                    setTimeout(() => { btn.textContent = 'Копировать'; btn.classList.remove('copied'); }, 1500);
                });
            });
            header.appendChild(btn);
            pre.replaceWith(wrapper);
            wrapper.appendChild(header);
            wrapper.appendChild(pre);
        });
    }

    function emptyStateHTML() {
        return `
            <div class="empty" id="emptyState">
                <div class="icon">✨</div>
                <h2>Чем могу помочь?</h2>
                <p>Задайте любой вопрос — я отвечу в реальном времени.</p>
                <div class="suggestions">
                    <button data-prompt="Объясни, что такое замыкание в JavaScript, с примерами">💡 Замыкания в JS</button>
                    <button data-prompt="Напиши функцию на Python для быстрой сортировки с комментариями">🐍 Quicksort на Python</button>
                    <button data-prompt="Составь план изучения Spring Boot на 2 недели">📅 План Spring Boot</button>
                    <button data-prompt="Объясни разницу между REST и GraphQL в виде таблицы">📊 REST vs GraphQL</button>
                </div>
            </div>`;
    }
    function showEmptyState() { output.innerHTML = emptyStateHTML(); bindSuggestions(); }
    function removeEmptyState() {
        const empty = document.getElementById('emptyState');
        if (empty) empty.remove();
    }

    function appendMessage(cls) {
        removeEmptyState();
        const row = document.createElement('div');
        row.className = 'message ' + cls;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = cls === 'user' ? 'Вы' : 'AI';

        const body = document.createElement('div');
        body.className = 'msg-body';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        body.appendChild(bubble);

        if (cls === 'ai') {
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            const copyBtn = document.createElement('button');
            copyBtn.textContent = '📋 Копировать ответ';
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(bubble.dataset.raw || bubble.textContent);
            });
            actions.appendChild(copyBtn);
            body.appendChild(actions);
        }

        row.appendChild(avatar);
        row.appendChild(body);
        output.appendChild(row);
        scrollToBottom(true);
        return bubble;
    }

    // ===== История =====
    async function loadHistory(sessionId) {
        output.innerHTML = '';
        try {
            const resp = await fetch('/chat/history/' + encodeURIComponent(sessionId), {
                headers: { 'Accept': 'application/json' }
            });
            if (!resp.ok) { showEmptyState(); return; }
            const messages = await resp.json();
            if (!Array.isArray(messages) || messages.length === 0) { showEmptyState(); return; }
            messages.forEach(m => {
                if (m.role === 'user') {
                    const b = appendMessage('user');
                    b.textContent = m.content;
                } else if (m.role === 'assistant') {
                    const b = appendMessage('ai');
                    b.dataset.raw = m.content;
                    renderMarkdown(b, m.content);
                }
            });
            scrollToBottom(true);
        } catch (err) {
            console.warn('Не удалось загрузить историю:', err);
            showEmptyState();
        }
    }

    async function clearHistoryOnServer(sessionId) {
        try {
            await fetch('/chat/history/' + encodeURIComponent(sessionId), { method: 'DELETE' });
        } catch (err) {
            console.warn('Очистка истории не удалась:', err);
        }
    }

    // ===== Переключение / создание / удаление =====
    function abortStreaming() { if (streaming) controller?.abort(); }

    async function switchChat(id) {
        if (id === activeId) { closeSidebar(); return; }
        abortStreaming();
        activeId = id;
        localStorage.setItem(ACTIVE_KEY, id);
        renderSidebar();
        closeSidebar();
        input.focus();
        await loadHistory(id);
    }

    async function createNewChat() {
        abortStreaming();
        try {
            const s = await apiCreateSession();
            sessions.unshift(s);
            activeId = s.id;
            localStorage.setItem(ACTIVE_KEY, s.id);
            renderSidebar();
            closeSidebar();
            output.innerHTML = '';
            showEmptyState();
            input.focus();
        } catch (e) {
            console.error('Не удалось создать чат:', e);
        }
    }

    async function removeChat(id) {
        const target = sessions.find(s => s.id === id);
        const title = target?.title || 'этот чат';
        if (!confirm(`Удалить «${title}»?`)) return;

        if (id === activeId) abortStreaming();

        await apiDeleteSession(id);
        sessions = sessions.filter(s => s.id !== id);

        if (id === activeId) {
            if (sessions.length > 0) {
                activeId = sessions[0].id;
                localStorage.setItem(ACTIVE_KEY, activeId);
                renderSidebar();
                await loadHistory(activeId);
            } else {
                await createNewChat();
                return;
            }
        } else {
            renderSidebar();
        }
    }

    // ===== Отправка =====
    async function send(prompt) {
        if (streaming || !prompt || !activeId) return;

        // Локально обновим заголовок, если он дефолтный
        const cur = sessions.find(s => s.id === activeId);
        if (cur && (!cur.title || cur.title === 'Новый чат')) {
            cur.title = prompt.length > 60 ? prompt.slice(0, 60) + '…' : prompt;
            renderSidebar();
        }

        appendMessage('user').textContent = prompt;
        const aiBubble = appendMessage('ai');
        aiBubble.classList.add('streaming');

        streaming = true;
        sendBtn.disabled = true;
        input.disabled = true;
        clearBtn.disabled = true;
        stopBtn.style.display = 'inline-block';
        setStatus('busy');

        controller = new AbortController();
        let raw = '';
        let lastRender = 0;

        try {
            const resp = await fetch('/chat/stream', {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=UTF-8',
                    'Accept': 'text/plain',
                    'X-Session-Id': activeId
                },
                body: prompt,
                signal: controller.signal
            });

            if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

            const reader  = resp.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                raw += decoder.decode(value, { stream: true });
                const now = Date.now();
                if (now - lastRender > 80) {
                    renderMarkdown(aiBubble, raw);
                    lastRender = now;
                    scrollToBottom();
                }
            }

            raw += decoder.decode();
            aiBubble.dataset.raw = raw;
            renderMarkdown(aiBubble, raw);

            // Список чатов мог обновиться на бэке (title, last_used) — синхронизируемся
            refreshSessions();

        } catch (err) {
            if (err.name === 'AbortError') {
                aiBubble.dataset.raw = raw + '\n\n*⏹ Генерация остановлена*';
                renderMarkdown(aiBubble, aiBubble.dataset.raw);
            } else {
                setStatus('offline');
                aiBubble.textContent = '⚠️ Ошибка: ' + err.message;
                console.error(err);
            }
        } finally {
            aiBubble.classList.remove('streaming');
            streaming = false;
            controller = null;
            sendBtn.disabled = false;
            input.disabled = false;
            clearBtn.disabled = false;
            stopBtn.style.display = 'none';
            if (!statusDot.classList.contains('offline')) setStatus('online');
            input.focus();
            scrollToBottom();
        }
    }

    // ===== События =====
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const prompt = input.value.trim();
        if (!prompt) return;
        input.value = '';
        input.style.height = 'auto';
        send(prompt);
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            form.requestSubmit();
        }
    });
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    });

    stopBtn.addEventListener('click', () => controller?.abort());

    clearBtn.addEventListener('click', async () => {
        if (!activeId) return;
        if (streaming) controller?.abort();
        await clearHistoryOnServer(activeId);
        output.innerHTML = '';
        showEmptyState();
        input.focus();
    });

    newChatBtn.addEventListener('click', createNewChat);
    menuBtn.addEventListener('click', openSidebar);
    sidebarBd.addEventListener('click', closeSidebar);
    refreshBtn.addEventListener('click', refreshSessions);

    function bindSuggestions() {
        document.querySelectorAll('.suggestions button').forEach(btn => {
            btn.addEventListener('click', () => send(btn.dataset.prompt));
        });
    }

    // ===== Init =====
    (async function init() {
        await refreshSessions();

        if (sessions.length === 0) {
            // Первый заход — создаём сессию на бэке
            try {
                const s = await apiCreateSession();
                sessions = [s];
                activeId = s.id;
            } catch (e) {
                console.warn('Не удалось создать первую сессию:', e);
            }
        } else {
            const saved = localStorage.getItem(ACTIVE_KEY);
            activeId = sessions.some(s => s.id === saved) ? saved : sessions[0].id;
        }

        if (activeId) {
            localStorage.setItem(ACTIVE_KEY, activeId);
            renderSidebar();
            await loadHistory(activeId);
        }
        input.focus();
    })();
</script>
