spring.application.name=food
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/food}
spring.datasource.username=${DB_USER:food}
spring.datasource.password=${DB_PASSWORD:food}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
management.endpoints.web.exposure.include=health,prometheus
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
