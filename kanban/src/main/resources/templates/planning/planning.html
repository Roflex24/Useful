<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Стратегическое планирование | NeoProject Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at 0% 0%, #0f0c2a 0%, #1a1747 50%, #0f0c2a 100%);
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(79, 70, 229, 0.15));
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
            filter: blur(12px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.2; }
            25% { transform: translateY(-40px) translateX(30px) rotate(90deg); opacity: 0.4; }
            50% { transform: translateY(0) translateX(50px) rotate(180deg); opacity: 0.2; }
            75% { transform: translateY(40px) translateX(30px) rotate(270deg); opacity: 0.4; }
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .top-navbar {
            backdrop-filter: blur(20px);
            background: rgba(15, 12, 42, 0.6);
            border-radius: 1.5rem;
            padding: 1rem 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #c4b5fd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .projects-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 2rem;
            padding: 0.6rem 1.4rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .projects-button:hover {
            background: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .header {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(79, 70, 229, 0.1));
            border-radius: 1.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.3);
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 50%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1rem;
            font-weight: 500;
        }

        .filter-bar {
            backdrop-filter: blur(20px);
            background: rgba(15, 12, 42, 0.5);
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .filter-btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid rgba(139, 92, 246, 0.4);
            background: rgba(0, 0, 0, 0.3);
            color: rgba(255, 255, 255, 0.8);
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-left: auto;
            padding: 0.4rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 2rem;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .toggle-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(107, 114, 128, 0.6);
            transition: 0.3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .toggle-status {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .toggle-status.inactive {
            background: rgba(107, 114, 128, 0.2);
            color: #9ca3af;
        }

        .add-plan-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
        }

        .add-plan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .plan-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1.25rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(139, 92, 246, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .plan-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border-color: rgba(139, 92, 246, 0.6);
            background: rgba(255, 255, 255, 0.08);
        }

        .plan-type-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .plan-type-WEEK { background: linear-gradient(135deg, #4299e1, #3182ce); color: white; }
        .plan-type-MONTH { background: linear-gradient(135deg, #ed8936, #dd6b20); color: white; }
        .plan-type-QUARTER { background: linear-gradient(135deg, #9f7aea, #805ad5); color: white; }
        .plan-type-YEAR { background: linear-gradient(135deg, #f56565, #e53e3e); color: white; }

        .plan-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.6rem;
            padding-right: 80px;
        }

        .plan-dates {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .plan-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 0.8rem;
        }

        .status-EXCEEDED { background: #10b981; color: white; }
        .status-AS_PLANNED { background: #3b82f6; color: white; }
        .status-HARDER { background: #ef4444; color: white; }
        .status-NOT_STARTED { background: #6b7280; color: white; }
        .status-IN_PROGRESS { background: #f59e0b; color: white; }

        .edit-icon {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background: rgba(139, 92, 246, 0.3);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #c4b5fd;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .edit-icon:hover {
            background: rgba(139, 92, 246, 0.6);
            transform: scale(1.1);
        }

        .fullscreen-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c2a 0%, #1a1747 100%);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .fullscreen-modal-container {
            width: 90%;
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .fullscreen-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(139, 92, 246, 0.3);
        }

        .fullscreen-modal-header h2 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ffffff, #c4b5fd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .close-modal-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .btn-save {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .toast-message {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            z-index: 2001;
            border: 1px solid rgba(139, 92, 246, 0.3);
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* Иконка календаря - светлая */
        .form-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: brightness(0) invert(1);
            opacity: 0.75;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .form-group input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        .form-group input[type="date"] {
            color-scheme: dark;
        }

        /* Кастомный select */
        .form-group select {
            display: none;
        }

        .custom-select-wrapper {
            position: relative;
        }

        .custom-select-trigger {
            width: 100%;
            padding: 0.8rem 2.5rem 0.8rem 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .custom-select-trigger:hover,
        .custom-select-wrapper.open .custom-select-trigger {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
        }

        .custom-select-trigger .cs-arrow {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            transition: transform 0.25s ease;
            opacity: 0.8;
        }

        .custom-select-wrapper.open .cs-arrow {
            transform: rotate(180deg);
        }

        .custom-select-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #12103a 0%, #1c1952 100%);
            border: 1px solid rgba(139, 92, 246, 0.45);
            border-radius: 1rem;
            overflow: hidden;
            z-index: 9999;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(139, 92, 246, 0.15);
            opacity: 0;
            transform: translateY(-6px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .custom-select-wrapper.open .custom-select-dropdown {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .custom-select-option {
            padding: 0.7rem 1rem;
            font-size: 0.92rem;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .custom-select-option:not(:last-child) {
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        }

        .custom-select-option:hover {
            background: rgba(139, 92, 246, 0.25);
            color: #e0d4ff;
        }

        .custom-select-option.selected {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            font-weight: 600;
        }

        .custom-select-option.selected::after {
            content: '✓';
            margin-left: auto;
            color: #8b5cf6;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="app-container">
    <div class="top-navbar">
        <div class="logo"><span>✨</span> NeoProject Manager</div>
        <a href="/page/projects" class="projects-button"><span>📁</span> Проекты</a>
    </div>
    <div class="header">
        <h1><span>🎯</span> Стратегическое планирование <span>📊</span></h1>
        <p>Управление планами: Год → Квартал → Месяц → Неделя</p>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" data-type="ALL">Все</button>
        <button class="filter-btn" data-type="YEAR">Годовые</button>
        <button class="filter-btn" data-type="QUARTER">Квартальные</button>
        <button class="filter-btn" data-type="MONTH">Месячные</button>
        <button class="filter-btn" data-type="WEEK">Недельные</button>

        <div class="toggle-container">
            <span class="toggle-label">
                <i>📅</i> Только актуальные
            </span>
            <label class="switch">
                <input type="checkbox" id="relevantToggle" checked>
                <span class="slider"></span>
            </label>
            <span id="toggleInfo" class="toggle-status">Вкл</span>
        </div>

        <button class="filter-btn add-plan-btn" id="addPlanBtn">➕ Создать план</button>
    </div>

    <div id="cardsContainer" class="cards-grid">
        <div class="loading">Загрузка...</div>
    </div>
</div>

<script>
    const API_BASE = '/api/planning';
    let currentType = 'ALL';
    let relevantOnly = true;

    function createParticles() {
        const container = document.getElementById('particles');
        if (!container) return;
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const s = Math.random() * 150 + 50;
            p.style.width = s + 'px';
            p.style.height = s + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = Math.random() * 10 + 15 + 's';
            container.appendChild(p);
        }
    }
    createParticles();

    function showToast(msg, isError = false) {
        const existing = document.querySelector('.toast-message');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = msg;
        toast.style.background = isError ? 'rgba(185, 28, 28, 0.95)' : 'rgba(16, 185, 129, 0.95)';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2800);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        return new Date(dateStr).toLocaleDateString('ru-RU');
    }

    function getPlanTypeName(type) {
        const names = { WEEK: 'Неделя', MONTH: 'Месяц', QUARTER: 'Квартал', YEAR: 'Год' };
        return names[type] || type;
    }

    function getStatusName(status) {
        const names = {
            EXCEEDED: '✅ Выше ожидаемого',
            AS_PLANNED: '📊 Как планировал',
            HARDER: '⚠️ Сложнее',
            IN_PROGRESS: '🔄 В процессе',
            NOT_STARTED: '❌ Не приступил'
        };
        return names[status] || status;
    }

    async function loadPlans() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '<div class="loading">Загрузка...</div>';

        try {
            let url = `${API_BASE}?relevantOnly=${relevantOnly}`;
            if (currentType !== 'ALL') {
                url += `&type=${currentType}`;
            }

            const response = await fetch(url);
            if (!response.ok) throw new Error('Network error');
            const plans = await response.json();
            renderPlans(plans);
        } catch (error) {
            console.error('Error:', error);
            container.innerHTML = '<div class="empty-state">❌ Ошибка загрузки данных</div>';
        }
    }

    function renderPlans(plans) {
        const container = document.getElementById('cardsContainer');
        if (!container) return;

        if (plans.length === 0) {
            const message = relevantOnly
                ? '📭 Нет актуальных планов. Отключите фильтр "Только актуальные" чтобы увидеть все планы.'
                : '📭 Нет планов. Создайте первый план!';
            container.innerHTML = `<div class="empty-state">${message}</div>`;
            return;
        }

        container.innerHTML = plans.map(plan => `
            <div class="plan-card">
                <div class="plan-type-badge plan-type-${plan.planType}">${getPlanTypeName(plan.planType)}</div>
                <div class="plan-title">${escapeHtml(plan.title || 'Без названия')}</div>
                <div class="plan-dates">📅 ${formatDate(plan.startDate)} - ${formatDate(plan.endDate)}</div>
                <div class="plan-status status-${plan.status}">${getStatusName(plan.status)}</div>
                <div class="edit-icon" onclick="event.stopPropagation(); window.openEditPlanModal(${plan.id})">✏️</div>
                <div style="cursor: pointer; position: absolute; top: 0; left: 0; right: 0; bottom: 0;" onclick="window.location.href='/page/planning/${plan.id}/tasks'"></div>
            </div>
        `).join('');
    }

    window.openEditPlanModal = async function(id) {
        // Получаем актуальные данные плана с сервера
        const response = await fetch(`${API_BASE}/${id}`);
        if (!response.ok) {
            showToast('Ошибка загрузки данных плана', true);
            return;
        }
        const plan = await response.json();

        const modal = document.createElement('div');
        modal.className = 'fullscreen-modal';
        modal.innerHTML = `
            <div class="fullscreen-modal-container">
                <div class="fullscreen-modal-header">
                    <h2><span>✏️</span> Редактирование плана</h2>
                    <button class="close-modal-btn">✕</button>
                </div>
                <div class="fullscreen-form">
                    <div class="form-group">
                        <label>📌 Тип плана</label>
                        <select id="planType">
                            <option value="WEEK" ${plan.planType === 'WEEK' ? 'selected' : ''}>Неделя</option>
                            <option value="MONTH" ${plan.planType === 'MONTH' ? 'selected' : ''}>Месяц</option>
                            <option value="QUARTER" ${plan.planType === 'QUARTER' ? 'selected' : ''}>Квартал</option>
                            <option value="YEAR" ${plan.planType === 'YEAR' ? 'selected' : ''}>Год</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📝 Название</label>
                        <input type="text" id="title" value="${escapeHtml(plan.title)}">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>📅 Дата начала</label>
                            <input type="date" id="startDate" value="${plan.startDate || ''}">
                        </div>
                        <div class="form-group">
                            <label>📅 Дата окончания</label>
                            <input type="date" id="endDate" value="${plan.endDate || ''}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>🎯 Статус</label>
                        <select id="status">
                            <option value="IN_PROGRESS" ${plan.status === 'IN_PROGRESS' ? 'selected' : ''}>🔄 В процессе</option>
                            <option value="EXCEEDED" ${plan.status === 'EXCEEDED' ? 'selected' : ''}>✅ Выше ожидаемого</option>
                            <option value="AS_PLANNED" ${plan.status === 'AS_PLANNED' ? 'selected' : ''}>📊 Как планировал</option>
                            <option value="HARDER" ${plan.status === 'HARDER' ? 'selected' : ''}>⚠️ Сложнее</option>
                            <option value="NOT_STARTED" ${plan.status === 'NOT_STARTED' ? 'selected' : ''}>❌ Не приступил</option>
                        </select>
                    </div>
                    <div class="modal-buttons">
                        <button class="btn-cancel" id="cancelBtn">Отмена</button>
                        <button class="btn-save" id="saveBtn">💾 Сохранить</button>
                        <button class="btn-save btn-delete" id="deleteBtn">🗑 Удалить</button>
                    </div>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        initCustomSelects(modal);

        const closeModal = () => modal.remove();

        const cancelBtn = modal.querySelector('#cancelBtn');
        const closeBtn = modal.querySelector('.close-modal-btn');

        if (cancelBtn) cancelBtn.onclick = closeModal;
        if (closeBtn) closeBtn.onclick = closeModal;

        const saveBtn = modal.querySelector('#saveBtn');
        if (saveBtn) {
            saveBtn.onclick = async () => {
                const planData = {
                    planType: modal.querySelector('#planType').value,
                    title: modal.querySelector('#title').value,
                    startDate: modal.querySelector('#startDate').value,
                    endDate: modal.querySelector('#endDate').value,
                    status: modal.querySelector('#status').value
                };

                if (!planData.title) {
                    showToast('Введите название плана', true);
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(planData)
                    });

                    if (response.ok) {
                        showToast('✅ План обновлён!');
                        closeModal();
                        await loadPlans();
                    } else {
                        showToast('Ошибка обновления', true);
                    }
                } catch (error) {
                    showToast('Ошибка соединения', true);
                }
            };
        }

        const deleteBtn = modal.querySelector('#deleteBtn');
        if (deleteBtn) {
            deleteBtn.onclick = async () => {
                if (confirm('Удалить план и все его задачи?')) {
                    try {
                        const response = await fetch(`${API_BASE}/${id}`, {
                            method: 'DELETE'
                        });

                        if (response.ok) {
                            showToast('✅ План удалён');
                            closeModal();
                            await loadPlans();
                        } else {
                            showToast('Ошибка удаления', true);
                        }
                    } catch (error) {
                        showToast('Ошибка соединения', true);
                    }
                }
            };
        }

        modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    };

                <div class="fullscreen-form">

                        <select id="planType">

        if (cancelBtn) cancelBtn.onclick = closeModal;

        const saveBtn = modal.querySelector('#saveBtn');
        if (saveBtn) {
            saveBtn.onclick = async () => {
                const planData = {

                    title: modal.querySelector('#title').value,
                    startDate: modal.querySelector('#startDate').value,
                    endDate: modal.querySelector('#endDate').value,

                };

                if (!planData.title) {
                    showToast('Введите название плана', true);
                    return;
                }

                try {
                    const response = await fetch(API_BASE, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(planData)
                    });

                    if (response.ok) {
                        showToast('✅ План создан!');
                        closeModal();
                        await loadPlans();
                    } else {
                        showToast('Ошибка создания', true);
                    }
                } catch (error) {

    function initFilters() {
        const filterBtns = document.querySelectorAll('.filter-btn[data-type]');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                loadPlans();
            });
        });
    }

    function initRelevantToggle() {
        const toggle = document.getElementById('relevantToggle');
        const toggleInfo = document.getElementById('toggleInfo');

        if (toggle) {
            toggle.addEventListener('change', (e) => {
                relevantOnly = e.target.checked;
                if (toggleInfo) {
                    toggleInfo.textContent = relevantOnly ? 'Вкл' : 'Выкл';
                    toggleInfo.className = relevantOnly ? 'toggle-status' : 'toggle-status inactive';
                }
                loadPlans();

                const message = relevantOnly
                    ? '🔍 Показаны только актуальные планы'
                    : '📋 Показаны все планы';
                showToast(message);
            });
        }
    }

    function initAddButton() {
        const addBtn = document.getElementById('addPlanBtn');
        if (addBtn) {
            const newAddBtn = addBtn.cloneNode(true);
            addBtn.parentNode.replaceChild(newAddBtn, addBtn);
            newAddBtn.addEventListener('click', () => showCreatePlanModal());
        }
    }


    // === КАСТОМНЫЕ SELECT-Ы ===
    function initCustomSelects(container) {
        container.querySelectorAll('select').forEach(select => {
            const wrapper = document.createElement('div');
            wrapper.className = 'custom-select-wrapper';

            const options = Array.from(select.options);
            const selectedOpt = options.find(o => o.selected) || options[0];

            wrapper.innerHTML = `
                <div class="custom-select-trigger">
                    <span class="cs-label">${selectedOpt ? selectedOpt.text : ''}</span>
                    <svg class="cs-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="custom-select-dropdown">
                    ${options.map(o => `<div class="custom-select-option${o.selected ? ' selected' : ''}" data-value="${o.value}">${o.text}</div>`).join('')}
                </div>
            `;

            select.parentNode.insertBefore(wrapper, select);
            wrapper.appendChild(select);

            const trigger = wrapper.querySelector('.custom-select-trigger');
            const label = wrapper.querySelector('.cs-label');

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.custom-select-wrapper.open').forEach(w => {
                    if (w !== wrapper) w.classList.remove('open');
                });
                wrapper.classList.toggle('open');
            });

            wrapper.querySelectorAll('.custom-select-option').forEach(opt => {
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const val = opt.dataset.value;
                    select.value = val;
                    label.textContent = opt.textContent;
                    wrapper.querySelectorAll('.custom-select-option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    wrapper.classList.remove('open');
                });
            });

            document.addEventListener('click', () => wrapper.classList.remove('open'));
        });
    }

    async function init() {
        initFilters();
        initRelevantToggle();
        initAddButton();
        await loadPlans();
    }

    init();
</script>
