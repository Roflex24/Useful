spring.application.name=kanban
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/kanban}
spring.datasource.username=${DB_USER:kanban}
spring.datasource.password=${DB_PASSWORD:kanban}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
management.endpoints.web.exposure.include=health,prometheus
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
telegram.enabled=${TELEGRAM_ENABLED:false}
telegram.username=${TELEGRAM_USERNAME:}
telegram.token=${TELEGRAM_TOKEN:}
