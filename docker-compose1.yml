version: '3.8'

services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qwen-cpu
    ports:
      - "8090:8080"
    volumes:
      - ./models:/models
    command: >
      -m /models/Qwen3.5-4B_Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --threads 8
      --ctx-size 8192
      --verbose
      --repeat-penalty 1.1
    restart: unless-stopped
