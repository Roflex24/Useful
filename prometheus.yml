global:
  scrape_interval: 15s      # как часто собирать метрики по умолчанию
  evaluation_interval: 15s  # как часто проверять правила алертов

# Конфигурация сбора метрик (что именно мониторить)
scrape_configs:
  - job_name: 'spring-boot-app'
    scrape_interval: 10s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']