global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'common'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['common:8080']
  - job_name: 'finance'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['finance:8080']
  - job_name: 'food'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['food:8080']
  - job_name: 'kanban'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['kanban:8080']
