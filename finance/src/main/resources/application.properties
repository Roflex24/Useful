spring.application.name=finance
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/finance}
spring.datasource.username=${DB_USER:finance}
spring.datasource.password=${DB_PASSWORD:finance}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
management.endpoints.web.exposure.include=health,prometheus
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.main.headless=${HEADLESS:true}
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy}
spring.ai.openai.base-url=${OPENAI_BASE_URL:http://localhost:8090}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:Qwen3.5-4B_Q4_K_M.gguf}
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
